<!DOCTYPE html>
<html>
    <head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="styles.css" >
    <link rel="icon" type="image/png" href="images/amulet3.PNG">
    </head>

    <body>
<form action="index.php" method="POST"> <!--form tag method is post can use GET-->

 <label for="Username">Username:</label>
 <input type="text" id="Username" required placeholder="Username123" minlength="4" maxlength="20">
 <br>

 <label for="Password">Password:</label>
 <input type="password" id="Password" required minlength="6" maxlength="15">
 <br>

 <label for="Email">Email:</label>
 <input type="email" id="Email" required placeholder="Cookieman@email.com">
 <br>
 <label for="Phone">Phone #</label>
 <input type="tel" id="Phone" required placeholder="+44 1234567890" pattern="[0-9]{4}-[0-9]{6}">
 <br>
 <label for="DOB">Date of birth:</label>
 <input type="date" id="DOB"> 


 <input type="submit">
 <input type="reset">


</form>


    </body>


</html>
